<!-- Notification Popover Drawer -->
<div id="notification-drawer" class="absolute right-0 mt-3 w-80 bg-white border border-slate-200 rounded-2xl shadow-xl z-50 hidden">
    <div class="p-4 border-b border-slate-100 flex justify-between items-center">
        <span class="font-bold text-slate-800 text-sm">Notifications</span>
        <button id="clear-notifications-btn" class="text-[10px] text-primary font-bold hover:underline">Clear all</button>
    </div>
    <div id="notification-list" class="max-h-64 overflow-y-auto p-2 space-y-1.5">
        <div class="text-center py-6 text-xs text-slate-400">No new alerts.</div>
    </div>
</div>
